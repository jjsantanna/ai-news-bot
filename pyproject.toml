[project]
name = "compliance-evidence-extractor"
version = "0.1.0"
description = "Extract verbatim compliance evidence from documents against ISO standards (CLI, pandas, xlsx)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pysbd>=0.3.4",
    "rapidfuzz>=3.6",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "anthropic>=0.40",
    "openai>=1.40",
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tenacity>=8.2",
    "tiktoken>=0.7",
    "jinja2>=3.1",
    "diskcache>=5.6",
]

[project.optional-dependencies]
embeddings-local = ["sentence-transformers>=3.0", "torch>=2.2"]
rerank-cross-encoder = ["sentence-transformers>=3.0"]
rerank-cohere = ["cohere>=5.5"]
chunking-semantic = ["sentence-transformers>=3.0", "scikit-learn>=1.4"]
ollama = ["ollama>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]

[project.scripts]
ce = "compliance_extractor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fast: tests that don't call any LLM or download anything",
    "live_llm: tests that hit a real LLM API; require RECORD_LIVE_LLM=1",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
